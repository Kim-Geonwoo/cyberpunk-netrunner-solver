name: ci
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/../.dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./verify.sh
